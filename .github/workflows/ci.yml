name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Integration tests run against a real Postgres (embedded-postgres) with the
      # supabase/migrations applied, and a local fake of Supabase Auth.
      - run: npm test
